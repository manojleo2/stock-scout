name: Daily Stock Scout Telegram Alerts
on:
  schedule:
    # Test Cron for 11:03 AM & 11:05 AM IST (05:33 & 05:35 UTC)
    - cron: '33 5 * * *'
    - cron: '35 5 * * *'
    # 8:45 AM IST (03:15 UTC & 03:30 UTC backup)
    - cron: '15 3 * * 1-5'
    - cron: '30 3 * * 1-5'
    # 9:30 AM IST (04:00 UTC)
    - cron: '0 4 * * 1-5'
    # 3:45 PM IST (10:15 UTC)
    - cron: '15 10 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: 'Cron Execution Mode'
        options:
          - auto
          - pre_market
          - intraday
          - post_market
        default: 'auto'

jobs:
  run-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt lxml
          python -c "import nltk; nltk.download('vader_lexicon')"

      - name: Determine execution mode
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            MODE="auto"
          fi
          echo "SELECTED_MODE=$MODE" >> $GITHUB_ENV

      - name: Execute Alert Runner
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python utils/cron_runner.py ${{ env.SELECTED_MODE }}
