name: Daily Stock Scout Telegram Alerts
on:
  schedule:
    - cron: '15 3 * * 1-5'
    - cron: '0 4 * * 1-5'
    - cron: '15 10 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Cron Execution Mode (pre_market, intraday, post_market)'
        required: true
        default: 'pre_market'

jobs:
  run-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy scikit-learn requests feedparser nltk

      - name: Run Pre-Market Alert (03:15 UTC)
        if: github.event.schedule == '15 3 * * 1-5' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'pre_market')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python utils/cron_runner.py pre_market

      - name: Run Intraday Breakout Alert (04:00 UTC)
        if: github.event.schedule == '0 4 * * 1-5' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'intraday')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python utils/cron_runner.py intraday

      - name: Run Post-Market Audit (10:15 UTC)
        if: github.event.schedule == '15 10 * * 1-5' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'post_market')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python utils/cron_runner.py post_market
